<nav class="medai-navbar">
  <div class="nav-left">
    <button class="menu-toggle">
      <i class="fas fa-bars"></i>
    </button>
    <div class="nav-search-container">
      <i class="fas fa-search search-icon"></i>
      <input type="text" placeholder="Rechercher un patient, ID, etc..." class="search-input">
      <span class="search-shortcut">Ctrl + K</span>
    </div>
  </div>

  <div class="nav-right">
    <div class="nav-icons-group">
      <div class="icon-with-badge">
        <i class="far fa-bell"></i>
        <span class="badge-count">3</span>
      </div>
      <div class="icon-help">
        <i class="far fa-question-circle"></i>
      </div>
    </div>

    <div class="nav-user-profile" *ngIf="user">
      <div class="user-text">
        <span class="name">Dr. {{ user.prenom }} {{ user.nom }}</span>
        <span class="role">Médecin</span>
      </div>
      <div class="user-avatar-rect">
        <img src="https://i.pravatar.cc/150?u=martin" alt="Dr. Martin">
      </div>
    </div>
  </div>
</nav>
